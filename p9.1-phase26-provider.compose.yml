# Candidate-only provider-secret overlay.
# Use only after the operator creates the protected files named below.
# Never use this overlay with the production Compose project.

services:
  backend:
    environment:
      P9_PROVIDER_ENCRYPTION_KEY_FILE: /run/secrets/provider_encryption_key
      SPOTIFY_CLIENT_ID_FILE: /run/secrets/spotify_client_id
      SPOTIFY_CLIENT_SECRET_FILE: /run/secrets/spotify_client_secret
      SPOTIFY_CALLBACK_URL: https://api.personalbmo.web.id/api/v1/integrations/spotify/callback
    secrets:
      - provider_encryption_key
      - spotify_client_id
      - spotify_client_secret

secrets:
  provider_encryption_key:
    file: ${P9_PROVIDER_ENCRYPTION_KEY_FILE:?Set candidate provider-key file outside Git}
  spotify_client_id:
    file: ${SPOTIFY_CLIENT_ID_FILE:?Set candidate Spotify client-ID file outside Git}
  spotify_client_secret:
    file: ${SPOTIFY_CLIENT_SECRET_FILE:?Set candidate Spotify client-secret file outside Git}
