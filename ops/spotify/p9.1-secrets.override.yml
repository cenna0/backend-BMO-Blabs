# Candidate-only Spotify secret overlay.
# Host paths must point to protected files outside Git; Compose mounts secrets read-only.
# Never use this overlay with the production Compose project.

services:
  backend:
    environment:
      SPOTIFY_CLIENT_ID: ""
      SPOTIFY_CLIENT_SECRET: ""
      SPOTIFY_TOKEN_ENCRYPTION_KEY: ""
      SPOTIFY_CLIENT_ID_FILE: /run/secrets/spotify_client_id
      SPOTIFY_CLIENT_SECRET_FILE: /run/secrets/spotify_client_secret
      SPOTIFY_TOKEN_ENCRYPTION_KEY_FILE: /run/secrets/spotify_token_encryption_key
      SPOTIFY_CALLBACK_URL: http://127.0.0.1:4310/api/v1/integrations/spotify/callback
    secrets:
      - source: spotify_client_id
        target: spotify_client_id
        mode: 0400
      - source: spotify_client_secret
        target: spotify_client_secret
        mode: 0400
      - source: spotify_token_encryption_key
        target: spotify_token_encryption_key
        mode: 0400

secrets:
  spotify_client_id:
    file: ${SPOTIFY_CLIENT_ID_FILE:?Set SPOTIFY_CLIENT_ID_FILE to a protected host file outside Git}
  spotify_client_secret:
    file: ${SPOTIFY_CLIENT_SECRET_FILE:?Set SPOTIFY_CLIENT_SECRET_FILE to a protected host file outside Git}
  spotify_token_encryption_key:
    file: ${SPOTIFY_TOKEN_ENCRYPTION_KEY_FILE:?Set SPOTIFY_TOKEN_ENCRYPTION_KEY_FILE to a protected host file outside Git}
