# Compose override for the isolated Piper-only audio candidate.
# Use with p9.1-compose.yml. It keeps production ports and workloads intact.

services:
  backend:
    image: ${P9_CANDIDATE_IMAGE:?Set P9_CANDIDATE_IMAGE to the verified candidate backend image}
    environment:
      AUDIO_SERVICE_URL: http://127.0.0.1:8002

  audio:
    image: ${AUDIO_CANDIDATE_IMAGE:?Set AUDIO_CANDIDATE_IMAGE to the verified candidate audio image}
    env_file:
      - path: ${AUDIO_ENV_FILE:-/opt/bmo/config/audio.env}
        required: true
    environment:
      AUDIO_SERVICE_HOST: 0.0.0.0
      AUDIO_SERVICE_PORT: "8002"
      MODEL_DOWNLOAD_ALLOWED: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      ORT_DISABLE_ALL_NETWORK: "1"
      TTS_PRIMARY_ENGINE: piper
      PIPER_MODEL: en_GB-semaine-medium
      PIPER_SPEAKER: prudence
      PIPER_SPEAKER_ID: "0"
      PIPER_MANIFEST_PATH: /opt/bmo/models/piper/PIPER_ASSET_MANIFEST.json
      RUNTIME_MODELS_ROOT: /opt/bmo/models/runtime
      MODEL_MANIFEST_PATH: /opt/bmo/models/runtime/MODEL_MANIFEST.json
      HF_HOME: /opt/bmo/cache/audio/huggingface
      XDG_CACHE_HOME: /opt/bmo/cache/audio/xdg
      TTS_TEMP_DIR: /opt/bmo/temp/tts-candidate
    ports:
      - target: 8002
        published: "8002"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - type: bind
        source: /opt/bmo/models/runtime
        target: /opt/bmo/models/runtime
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/bmo/models/piper
        target: /opt/bmo/models/piper
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/bmo/cache/audio
        target: /opt/bmo/cache/audio
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
      - /opt/bmo/temp/tts-candidate:rw,noexec,nosuid,nodev,size=256m
    mem_limit: 5g
    memswap_limit: 5g
    cpus: "4.0"
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/livez', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6
